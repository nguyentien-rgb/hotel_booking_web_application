<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile — Luxury Hotel Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../shared/css/global.css" />
    <link rel="stylesheet" href="../shared/css/dark-mode.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <main class="page">
      <div class="container profile-page">
        <section class="card profile-head">
          <div class="profile-avatar" id="profile-avatar">?</div>
          <div>
            <h1 class="profile-name" id="profile-name">...</h1>
            <p class="profile-email" id="profile-email"></p>
            <p class="profile-email" id="profile-phone"></p>
          </div>
        </section>

        <section class="card">
          <div class="profile-bookings-head">
            <h2>My bookings</h2>
            <nav class="profile-tabs" id="profile-tabs">
              <button class="profile-tab active" data-tab="all" type="button">All</button>
              <button class="profile-tab" data-tab="upcoming" type="button">Upcoming</button>
              <button class="profile-tab" data-tab="past" type="button">Past</button>
              <button class="profile-tab" data-tab="cancelled" type="button">Cancelled</button>
            </nav>
          </div>
          <div id="profile-booking-list">
            <p class="text-muted">Loading bookings...</p>
          </div>
        </section>
      </div>
    </main>

    <div id="app-footer"></div>

    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/router.js"></script>
    <script src="../shared/js/render.js"></script>
    <script src="../shared/js/api.js"></script>

    <script src="script.js"></script>
  </body>
</html>
