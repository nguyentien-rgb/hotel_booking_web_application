<header class="site-header">
  <div class="container header-inner">
    <div class="header-left">
      <a href="../home/index.html" class="header-logo" aria-label="Luxury Hotel Booking">
        HB
      </a>
      <div class="header-title">
        <span class="header-title-main">Luxury Hotel Booking</span>
        <span class="header-title-sub">Stay in style, book in seconds</span>
      </div>
    </div>

    <nav class="main-nav">
      <a href="../home/index.html" data-nav="home">Home</a>
      <a href="../search/index.html" data-nav="search">Search</a>
      <a href="../profile/index.html" data-nav="profile">Profile</a>
    </nav>

    <div class="header-actions">
      <button id="theme-toggle" class="btn-icon" type="button" aria-label="Toggle theme">
        🌙
      </button>
      <a href="../login/index.html" class="header-link" id="header-login-link">Login</a>
      <a
        href="../register/index.html"
        class="header-link"
        id="header-register-link"
       
      >
        Sign up
      </a>
      <!-- Menu người dùng: rê chuột (hoặc bấm) vào tên để mở -->
      <div class="user-menu hidden" id="header-user-menu">
        <button
          id="header-user-btn"
          class="user-menu-trigger"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span class="user-avatar" id="header-user-avatar">?</span>
          <span id="header-user-name">Hi</span>
          <span class="user-caret" aria-hidden="true">▾</span>
        </button>
        <div class="user-menu-dropdown" role="menu">
          <div class="user-menu-info">
            <strong id="user-menu-fullname"></strong>
            <span id="user-menu-email"></span>
            <span class="user-menu-role" id="user-menu-role"></span>
          </div>
          <a href="#" id="user-menu-home" class="user-menu-item" role="menuitem">My profile</a>
          <button type="button" id="user-menu-logout" class="user-menu-item user-menu-logout" role="menuitem">
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
