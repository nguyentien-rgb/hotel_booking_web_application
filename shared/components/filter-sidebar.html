<aside class="card filter-panel" id="filter-sidebar">
  <div class="filter-panel-head">
    <h3>Filters</h3>
    <button id="filter-reset-btn" class="filter-reset" type="button">Reset</button>
  </div>

  <div class="filter-group">
    <label for="filter-location" class="filter-label">Destination</label>
    <select id="filter-location">
      <option value="">All destinations</option>
    </select>
  </div>

  <div class="filter-group">
    <span class="filter-label">Price per guest / night</span>
    <div class="chip-group" id="filter-price">
      <label class="chip"><input type="radio" name="price" value="" checked /><span>Any</span></label>
      <label class="chip"><input type="radio" name="price" value="0-700000" /><span>Under 700K</span></label>
      <label class="chip"><input type="radio" name="price" value="700000-1000000" /><span>700K – 1M</span></label>
      <label class="chip"><input type="radio" name="price" value="1000000-" /><span>Over 1M</span></label>
    </div>
  </div>

  <div class="filter-group">
    <span class="filter-label">Guest rating</span>
    <div class="chip-group" id="filter-rating">
      <label class="chip"><input type="radio" name="rating" value="" checked /><span>Any</span></label>
      <label class="chip"><input type="radio" name="rating" value="4.5" /><span>4.5★ +</span></label>
      <label class="chip"><input type="radio" name="rating" value="4" /><span>4★ +</span></label>
    </div>
  </div>
</aside>
