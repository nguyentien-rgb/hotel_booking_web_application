<form id="search-bar-form" class="search-bar card card-soft" autocomplete="off" role="search">
  <span class="search-bar-icon" aria-hidden="true">🔍</span>
  <input
    type="search"
    id="search-query"
    class="search-bar-input"
    placeholder="Hotel name or destination, e.g. Sa Pa, ha long..."
    aria-label="Hotel name or destination"
  />
  <button type="submit" class="btn btn-gold">Search</button>
</form>
