<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Admin — Luxury Hotel Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../shared/css/global.css" />
    <link rel="stylesheet" href="../shared/css/dark-mode.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <main class="page">
      <div class="container admin-page">
        <section class="card card-soft admin-intro">
          <div>
            <h1 class="page-title">Admin dashboard</h1>
            <p class="page-subtitle">Approve hotels, manage users and monitor bookings.</p>
          </div>
        </section>

        <!-- ===== THỐNG KÊ ===== -->
        <section class="stat-grid" id="stat-grid">
          <div class="card stat-card"><span class="stat-label">Loading...</span></div>
        </section>

        <!-- ===== TAB ===== -->
        <nav class="admin-tabs">
          <button class="admin-tab active" data-tab="hotels" type="button">Hotels</button>
          <button class="admin-tab" data-tab="users" type="button">Users</button>
          <button class="admin-tab" data-tab="bookings" type="button">Bookings</button>
        </nav>

        <!-- Khách sạn -->
        <section class="card admin-panel" id="panel-hotels">
          <div class="section-head">
            <h2>Hotels</h2>
            <select id="hotel-filter">
              <option value="pending" selected>Pending approval</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
              <option value="">All</option>
            </select>
          </div>
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Hotel</th>
                  <th>Owner</th>
                  <th>Price</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="hotel-table-body"></tbody>
            </table>
          </div>
        </section>

        <!-- Người dùng -->
        <section class="card admin-panel hidden" id="panel-users">
          <div class="section-head">
            <h2>Users</h2>
            <select id="user-filter">
              <option value="">All roles</option>
              <option value="customer">Customers</option>
              <option value="owner">Hotel owners</option>
              <option value="admin">Admins</option>
            </select>
          </div>
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>User</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="user-table-body"></tbody>
            </table>
          </div>
        </section>

        <!-- Booking -->
        <section class="card admin-panel hidden" id="panel-bookings">
          <div class="section-head">
            <h2>Bookings</h2>
            <select id="admin-booking-filter">
              <option value="">All</option>
              <option value="pending">Waiting for confirmation</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Hotel</th>
                  <th>Guest</th>
                  <th>Stay</th>
                  <th>Total</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="admin-booking-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <div id="app-footer"></div>

    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/router.js"></script>
    <script src="../shared/js/render.js"></script>
    <script src="../shared/js/api.js"></script>
    <script src="script.js"></script>
  </body>
</html>
