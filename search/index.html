<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Luxury Hotel Booking — Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../shared/css/global.css" />
    <link rel="stylesheet" href="../shared/css/dark-mode.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <main class="page">
      <div class="container">
        <header class="page-header">
          <h1 class="page-title">Find your stay</h1>
          <p class="page-subtitle">Search by hotel or destination, then narrow down with filters.</p>
        </header>

        <section id="search-bar-root" class="search-bar-section"></section>

        <section class="search-layout">
          <div id="filter-sidebar-root" class="search-sidebar"></div>

          <div class="search-results">
            <div class="search-results-header">
              <p id="search-results-meta" class="search-results-meta">Loading hotels...</p>
              <label class="sort-control">
                <span>Sort by</span>
                <select id="filter-sort">
                  <option value="">Recommended</option>
                  <option value="price-asc">Price: low to high</option>
                  <option value="price-desc">Price: high to low</option>
                  <option value="rating-desc">Top rated</option>
                </select>
              </label>
            </div>
            <div id="active-filters" class="active-filters"></div>
            <div id="search-results-list" class="grid search-grid"></div>
          </div>
        </section>
      </div>
    </main>

    <div id="app-footer"></div>

    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/router.js"></script>
    <script src="../shared/js/render.js"></script>
    <script src="../shared/js/api.js"></script>

    <script src="script.js"></script>
  </body>
</html>
